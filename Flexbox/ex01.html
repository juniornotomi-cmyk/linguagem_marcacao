<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Layout</title>

    <style>
        body {
            margin: 0;
            padding: 20px;
        }

        header {
            background-color: #333;
            color: white;
            height: 45px;
            text-align: center;
            line-height: 45px;
            margin-bottom: 7px;
        }

        .container {
            display: flex;
            gap: 7px;
            height: 375px;
            margin: 0 8px;
        }

        .menu {
            background-color: coral;
            width: 25%;
        }

        main {
            background-color: #999;
            width: 50%;
        }

        .lateral {
            background-color: coral;
            width: 25%;
        }

        footer {
            background-color: #333;
            color: white;
            height: 30px;
            text-align: center;
            line-height: 30px;
            margin-top: 7px;
        }
    </style>
</head>

<body>

    <header>
        Header
    </header>

    <div class="container">

        <aside class="menu">
            Menu Lateral
        </aside>

        <main>
            Conteúdo Principal
        </main>

        <aside class="lateral">
            Lateral Direita
        </aside>

    </div>

    <footer>
        Rodapé
    </footer>

</body>
</html>
